services:
  # Terminal MT5 Windows executado sob Wine. A porta da ponte Python fica
  # somente na rede interna do Compose; a interface noVNC e limitada ao host
  # para o primeiro login/manual de diagnostico em http://localhost:8081.
  mt5-wine:
    # Opcional: so sobe com `--profile local-mt5`. Quem ja tem um container
    # de MetaTrader rodando (outro compose, outra VPS) nao quer um segundo
    # terminal competindo pela mesma conta na corretora.
    profiles: ["local-mt5"]
    build:
      context: .
      dockerfile: docker/mt5-wine.Dockerfile
    image: trader-top-mt5-wine
    restart: unless-stopped
    environment:
      MT5_HOST: 0.0.0.0
      MT5_LOGIN: ${MT5_LOGIN:-}
      MT5_PASSWORD: ${MT5_PASSWORD:-}
      MT5_SERVER: ${MT5_SERVER:-}
      # Sem `:?` de proposito: a interpolacao roda mesmo com o profile
      # desligado, e derrubaria o compose de quem nao usa este servico.
      VNC_PASSWORD: ${MT5_VNC_PASSWORD:-}
      NOVNC_HOST: localhost
    ports:
      - "127.0.0.1:${MT5_VNC_PORT:-8081}:8080"
    expose:
      - "18812"
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/18812'"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 45s

  db:
    image: mysql:8.0
    restart: unless-stopped
    command:
      - --default-authentication-plugin=caching_sha2_password
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-CHANGE_ME_root}
      MYSQL_DATABASE: ${DB_NAME:-mt5_ai_scalper}
      MYSQL_USER: ${DB_USER:-scalper}
      MYSQL_PASSWORD: ${DB_PASSWORD:-CHANGE_ME}
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      # O worker MT5 roda no mesmo Windows e acessa esta porta pelo host.
      # Nao publique o banco na rede local/Internet.
      - "127.0.0.1:${DB_EXPOSED_PORT:-3306}:3306"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h 127.0.0.1 -u root --password=\"$${MYSQL_ROOT_PASSWORD}\" --silent",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  app:
    build: .
    restart: unless-stopped
    init: true
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_ENV: ${APP_ENV:-production}
      APP_SECRET_KEY: ${APP_SECRET_KEY:?defina APP_SECRET_KEY no .env}
      APP_HOST: 0.0.0.0
      APP_PORT: 8000
      SYSTEM_MODE: DISABLED
      DASHBOARD_AUTH_DISABLED: ${DASHBOARD_AUTH_DISABLED:-false}
      # Vazio de proposito: aponte a ponte pelo painel (Configuracoes ->
      # Conexao MetaTrader 5), que tem precedencia sobre esta variavel.
      # Um padrao fixo aqui viraria um nome que nao resolve, e o erro
      # resultante culparia a rede em vez da configuracao ausente.
      MT5_BRIDGE_HOST: ${MT5_BRIDGE_HOST:-}
      MT5_BRIDGE_PORT: ${MT5_BRIDGE_PORT:-18812}
      GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID:-}
      GOOGLE_OAUTH_CLIENT_SECRET: ${GOOGLE_OAUTH_CLIENT_SECRET:-}
      GOOGLE_OAUTH_REDIRECT_URI: ${GOOGLE_OAUTH_REDIRECT_URI:-}
      DB_DRIVER: mysql+pymysql
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-mt5_ai_scalper}
      DB_USER: ${DB_USER:-scalper}
      DB_PASSWORD: ${DB_PASSWORD:-CHANGE_ME}
      DB_POOL_SIZE: ${DB_POOL_SIZE:-5}
      DB_POOL_MAX_OVERFLOW: ${DB_POOL_MAX_OVERFLOW:-10}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_DIR: /app/logs
      ML_DATASETS_DIR: /app/datasets
      ML_MODELS_DIR: /app/models
      QUALITY_MAX_SPREAD_POINTS: ${QUALITY_MAX_SPREAD_POINTS:-50.0}
      QUALITY_MAX_FEED_DELAY_SECONDS: ${QUALITY_MAX_FEED_DELAY_SECONDS:-300}
      ANALYSIS_DEFAULT_TIMEFRAME: ${ANALYSIS_DEFAULT_TIMEFRAME:-M15}
      ANALYSIS_DEFAULT_THRESHOLD: ${ANALYSIS_DEFAULT_THRESHOLD:-90.0}
      # Sem isto, o container cai no APP_SECRET_KEY para cifrar credenciais —
      # e trocar o secret de sessao tornaria a senha do MT5 indecifravel.
      CREDENTIALS_ENCRYPTION_KEY: ${CREDENTIALS_ENCRYPTION_KEY:-}
      AISA_API_KEY: ${AISA_API_KEY:-}
      AISA_API_BASE_URL: ${AISA_API_BASE_URL:-}
      # Tetos da MarketPulse. Sem eles aqui, os valores do .env eram
      # ignorados e o container ficava preso no default -- numa API paga
      # que este projeto ja esgotou uma vez, o teto precisa ser ajustavel
      # de onde se administra o servidor.
      NEWS_CACHE_TTL_SECONDS: ${NEWS_CACHE_TTL_SECONDS:-600}
      NEWS_DAILY_CALL_BUDGET: ${NEWS_DAILY_CALL_BUDGET:-300}
      # Calendario economico. O arquivo e exportado por um EA no terminal
      # Windows, entao na VPS ele so existe se alguem o colocar la e
      # montar o diretorio. Passar as variaveis nao cria o arquivo -- so
      # torna a configuracao possivel, que hoje nem era.
      CALENDAR_FILE_PATH: ${CALENDAR_FILE_PATH:-}
      CALENDAR_BLACKOUT_BEFORE_MINUTES: ${CALENDAR_BLACKOUT_BEFORE_MINUTES:-30}
      CALENDAR_BLACKOUT_AFTER_MINUTES: ${CALENDAR_BLACKOUT_AFTER_MINUTES:-15}
      CALENDAR_MIN_IMPACT: ${CALENDAR_MIN_IMPACT:-HIGH}
      CALENDAR_CACHE_TTL_SECONDS: ${CALENDAR_CACHE_TTL_SECONDS:-900}
      CALENDAR_MAX_AGE_HOURS: ${CALENDAR_MAX_AGE_HOURS:-36}
      CALENDAR_BLOCK_WHEN_UNAVAILABLE: ${CALENDAR_BLOCK_WHEN_UNAVAILABLE:-false}
      # Jev/TypeSafe. Este compose NAO usa `env_file`: so o que esta
      # listado aqui chega ao container. Sem estas linhas a chave ficaria
      # no .env sem efeito nenhum, e o painel diria "desligado" sem
      # explicar por que -- o pior tipo de falha de configuracao.
      JEV_ENABLED: ${JEV_ENABLED:-false}
      JEV_API_KEY: ${JEV_API_KEY:-}
      JEV_API_BASE_URL: ${JEV_API_BASE_URL:-https://api.typesafe.ai/v1/systemone}
      JEV_MODEL: ${JEV_MODEL:-jev-latest}
      JEV_TIMEOUT_SECONDS: ${JEV_TIMEOUT_SECONDS:-2.5}
      JEV_CACHE_TTL_SECONDS: ${JEV_CACHE_TTL_SECONDS:-300}
      JEV_DAILY_CALL_BUDGET: ${JEV_DAILY_CALL_BUDGET:-200}
      RUN_PREFLIGHT: ${RUN_PREFLIGHT:-true}
    extra_hosts:
      # Permite apontar a ponte do MetaTrader para `host.docker.internal`
      # quando o container do MT5 vive em outro projeto compose e publica a
      # porta 18812 no host. Sem isto, esse nome nao resolve no Linux.
      - "host.docker.internal:host-gateway"
    ports:
      # A API é pública somente pelo Traefik. A porta local continua
      # disponível para health checks e integrações que rodam neste host.
      - "127.0.0.1:${APP_PORT:-8000}:8000"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.trader-top.rule=Host(`trader-top.navit.com.br`)"
      - "traefik.http.routers.trader-top.entrypoints=websecure"
      - "traefik.http.routers.trader-top.tls=true"
      - "traefik.http.routers.trader-top.tls.certresolver=letsencrypt"
      - "traefik.http.services.trader-top.loadbalancer.server.port=8000"
    volumes:
      - ./logs:/app/logs
      - ./models:/app/models
      - ./datasets:/app/datasets
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    stop_grace_period: 20s

  # Worker continuo que usa a ponte mt5linux. Ele so inicia depois que a API
  # concluiu as migrations e esta saudavel, evitando duas inicializacoes do
  # banco durante o boot.
  mt5-worker:
    # Mesma regra do mt5-wine: parte do arranjo "terminal local", nao do
    # arranjo "terminal em outro container".
    profiles: ["local-mt5"]
    build: .
    restart: unless-stopped
    init: true
    depends_on:
      app:
        condition: service_healthy
    environment:
      APP_ENV: ${APP_ENV:-production}
      APP_SECRET_KEY: ${APP_SECRET_KEY:?defina APP_SECRET_KEY no .env}
      SYSTEM_MODE: DISABLED
      DB_DRIVER: mysql+pymysql
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-mt5_ai_scalper}
      DB_USER: ${DB_USER:-scalper}
      DB_PASSWORD: ${DB_PASSWORD:-CHANGE_ME}
      DB_POOL_SIZE: ${DB_POOL_SIZE:-5}
      DB_POOL_MAX_OVERFLOW: ${DB_POOL_MAX_OVERFLOW:-10}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_DIR: /app/logs
      ML_MODELS_DIR: /app/models
      ML_DATASETS_DIR: /app/datasets
      CREDENTIALS_ENCRYPTION_KEY: ${CREDENTIALS_ENCRYPTION_KEY:-}
      # Vazio de proposito: aponte a ponte pelo painel (Configuracoes ->
      # Conexao MetaTrader 5), que tem precedencia sobre esta variavel.
      # Um padrao fixo aqui viraria um nome que nao resolve, e o erro
      # resultante culparia a rede em vez da configuracao ausente.
      MT5_BRIDGE_HOST: ${MT5_BRIDGE_HOST:-}
      MT5_BRIDGE_PORT: ${MT5_BRIDGE_PORT:-18812}
      RUN_PREFLIGHT: "false"
    command:
      [
        "python",
        "-c",
        "from app.mt5.auto_sync import MT5AutoSyncWorker; MT5AutoSyncWorker().run()",
      ]
    volumes:
      - ./logs:/app/logs
      - ./models:/app/models
      - ./datasets:/app/datasets
    stop_grace_period: 20s

volumes:
  mysql_data:
